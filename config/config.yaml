# =============================================================================
# config.yaml — Central configuration for 01_clinical_genomics_ai
# Read this into R scripts with: yaml::read_yaml("config/config.yaml")
# =============================================================================

project:
  name: "01_clinical_genomics_ai"
  seed: 42

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_example: "data/example"
  outputs_tables: "outputs/tables"
  outputs_figures: "outputs/figures"
  outputs_models: "outputs/models"
  outputs_reports: "outputs/reports"

datasets:
  primary:
    name: "TCGA-BRCA"
    role: "primary"
  secondary:
    name: "TCGA-LUAD"
    role: "secondary"
  tertiary_stress_test:
    name: "TCGA-LAML"
    role: "tertiary_stress_test"

pipeline:
  min_sample_completeness: 0.80
  id_matching_key: "patient_barcode"
  prediction_targets:
    - "survival_status"
    - "risk_group"
    - "relapse_status"
    - "treatment_response"
    - "long_vs_short_survival"
    
    # =============================================================================
# Column and variable definitions
# =============================================================================
columns:
  clinical_id_column: "patient_id"       # standardized patient ID in clinical_cleaned.csv
  genomic_id_column: "patient_id"        # standardized patient ID in genomics_cleaned.csv
  outcome_variable: "outcome"            # target column in ml_feature_table.csv (vital_status derived)

# =============================================================================
# Feature engineering settings
# =============================================================================
features:
  top_genes_to_encode: 10                # number of top mutated genes to one-hot encode as features
  explicit_genes: ["TP53", "KRAS", "PIK3CA"]  # always-included gene features regardless of ranking

# =============================================================================
# Plot settings
# =============================================================================
plots:
  figure_width: 8
  figure_height: 6
  dpi: 300
  color_palette: "steelblue"
  theme: "minimal"

# =============================================================================
# Model settings
# =============================================================================
model:
  train_test_split: 0.8
  cv_folds: 5
  seed: 42
  models_to_run: ["logistic_regression", "random_forest", "xgboost"]
  primary_metric: "ROC"
